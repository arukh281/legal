name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.13, Django 5.2, PostgreSQL 18 + pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: lawyer_brain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: lawyer_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SETTINGS_MODULE: core.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key-32-bytes-long-min
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff Format Check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy Strict Type Check
        working-directory: backend
        run: uv run mypy .

      - name: Bootstrap DB roles for CI
        run: |
          psql -h localhost -U postgres -d lawyer_brain -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_rw') THEN
                CREATE ROLE app_rw LOGIN PASSWORD 'app_rw' NOINHERIT NOBYPASSRLS;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'worker') THEN
                CREATE ROLE worker LOGIN PASSWORD 'worker' NOINHERIT BYPASSRLS;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'admin_rw') THEN
                CREATE ROLE admin_rw LOGIN PASSWORD 'admin_rw' NOINHERIT BYPASSRLS;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'plc_writer') THEN
                CREATE ROLE plc_writer LOGIN PASSWORD 'plc_writer' NOINHERIT NOBYPASSRLS;
              END IF;
            END
            \$\$;
          "
        env:
          PGPASSWORD: postgres

      - name: Apply Migrations on PostgreSQL 18
        working-directory: backend
        run: uv run python manage.py migrate --database owner

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd \
            server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 1
          done

      - name: Pytest on real PostgreSQL 18 + pgvector
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (React 19, TypeScript, Vitest, Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: pnpm run lint

      - name: Vitest Unit Tests
        working-directory: frontend
        run: pnpm run test

      - name: TypeScript Build
        working-directory: frontend
        run: pnpm run build
